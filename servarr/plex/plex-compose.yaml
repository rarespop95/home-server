services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=
      - PLEX_CLAIM=${PLEX_CLAIM}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    runtime: nvidia
    volumes:
      - /docker/plex:/config
      - /data:/data
    restart: unless-stopped

  # Migrated from sct/overseerr (dev stalled) to Seerr, the unified successor
  # that merges Overseerr + Jellyseerr into one codebase. Seerr auto-migrates
  # the existing Overseerr database on first start. Data dir kept at
  # /docker/overseerr so config carries over (in-container path is /app/config).
  # Runs as node uid 1000 (no PUID/PGID), so chown the data dir to 1000:1000
  # before first start. init: true is required by the image.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - PORT=5055
    volumes:
      - /docker/overseerr:/app/config
    ports:
      - 5056:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/tautulli:/config
    ports:
      - 8181:8181
    depends_on:
      - plex
    restart: unless-stopped



  # Plex Meta Manager was rebranded to "Kometa". The meisnate12 image is
  # deprecated (no more latest/nightly tags). Config dir kept as-is so existing
  # config carries over; rename to /docker/kometa if you prefer.
  kometa:
    image: kometateam/kometa:latest
    container_name: kometa
    environment:
      - TZ=${TZ}
    volumes:
      - /docker/plex-meta-manager/config:/config
      - /docker/plex-meta-manager/logs:/logs
    depends_on:
      - plex
    restart: unless-stopped
