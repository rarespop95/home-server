services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=
      - PLEX_CLAIM=${PLEX_CLAIM}
    ports:
      - 32400:32400
    runtime: nvidia
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /docker/plex:/config
      - /data:/data
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/overseerr:/config
    ports:
      - 5056:5055
    depends_on:
      - plex
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/tautulli:/config
    ports:
      - 8181:8181
    depends_on:
      - plex
    restart: unless-stopped



  # Plex Meta Manager was rebranded to "Kometa". The meisnate12 image is
  # deprecated (no more latest/nightly tags). Config dir kept as-is so existing
  # config carries over; rename to /docker/kometa if you prefer.
  kometa:
    image: kometateam/kometa:latest
    container_name: kometa
    environment:
      - TZ=${TZ}
    volumes:
      - /docker/plex-meta-manager/config:/config
      - /docker/plex-meta-manager/logs:/logs
    depends_on:
      - plex
    restart: unless-stopped
