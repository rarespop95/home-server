                  style="display: inline-flex; align-items: center;">
                  {{ $downloadChange | printf "%+.1f%%" }}
                  {{ if gt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">DOWNLOAD</div>
              </div>
              <div>
                  {{ $uploadChange := percentChange ($stats.JSON.Float "data.upload.avg_bits") (.JSON.Float "data.upload_bits") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $uploadChange | printf "%+.1f%%" }}
                  {{ if gt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">UPLOAD</div>
              </div>
              <div>
                  {{ $pingChange := percentChange ($stats.JSON.Float "data.ping.avg") (.JSON.Float "data.ping") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $pingChange | printf "%+.1f%%" }}
                  {{ if lt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if gt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                  <div class="size-h6">PING</div>
              </div>
              </div>
          - type: custom-api
            title: Immich stats
            cache: 1d
            url: https://${IMMICH_URL}/api/server/statistics
            headers:
              x-api-key: ${IMMICH_API_KEY}
              Accept: application/json
            template: |
              <div class="flex justify-between text-center">
                <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div>
                    <div class="size-h6">PHOTOS</div>
                </div>
                <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div>
                    <div class="size-h6">VIDEOS</div>
                </div>
                <div>
                    <div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | toInt | formatNumber }}GB</div>
                    <div class="size-h6">USAGE</div>
                </div>
              </div>

      - size: full
        widgets:
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Plex
                url: https://tv.cwdsource.dev/
                check-url: http://192.168.50.89:32400/identity
                icon: di:plex
              - title: Tautulli
                url: http://192.168.50.89:8181/
                check-url: http://192.168.50.89:8181/
                icon: di:tautulli

              - title: Nextcloud
                url: https://cloud.cwdsource.dev/
                check-url: https://cloud.cwdsource.dev/
                icon: di:nextcloud
              - title: Immich
                url: https://immich.cwdsource.dev/
                check-url: http://192.168.50.130:2283/
                icon: di:immich
              - title: AdGuard
                url: https://adguard.cwdsource.dev/
                check-url: http://192.168.50.234/
                icon: di:adguard-home
              - title: Vaultwarden
                url: https://vw.cwdsource.dev/
                check-url: http://192.168.50.130:8088/
                icon: di:vaultwarden-light

          - type: monitor
            cache: 1m
            title: Servarr
            sites:
              - title: qBittorrent
                url: https://torrent.hopki.net/
                check-url: http://192.168.50.89:8080/
                icon: di:qbittorrent
              - title: Seerr
                url: https://seerr.cwdsource.dev/
                check-url: http://192.168.50.89:5056/
                icon: di:seerr
              - title: Radarr
                url: https://arr.cwdsource.dev/radarr
                check-url: http://192.168.50.89:7878/
                icon: di:radarr
              - title: Sonarr
                url: https://arr.cwdsource.dev/sonarr
                check-url: http://192.168.50.89:8989/
                icon: di:sonarr
              - title: Readarr
                url: https://arr.cwdsource.dev/readarr
                check-url: http://192.168.50.89:8787/
                icon: di:readarr
              - title: Bazarr
                url: https://arr.cwdsource.dev/bazarr
                check-url: http://192.168.50.89:6767/
                icon: di:bazarr
              - title: Prowlarr
                url: https://arr.cwdsource.dev/prowlarr
                check-url: http://192.168.50.89:9696/
                icon: di:prowlarr
              - title: Audiobookshelf
                url: https://bookshelf.cwdsource.dev/
                check-url: http://192.168.50.89:13378/
                icon: di:audiobookshelf
              - title: File Browser
                url: https://arr.cwdsource.dev/
                check-url: http://192.168.50.89:8900/
                icon: di:filebrowser
              - title: Portainer
                url: https://192.168.50.89:9443/
                check-url: https://192.168.50.89:9443/
                allow-insecure: true
                icon: di:portainer
          - type: split-column
            widgets:
            - type: custom-api
              title: Sonarr - Recent
              cache: 30m
              options:
                service: sonarr
                type: recent
                size: small
                collapse-after: 3
                show-grabbed: false
                interval: 30
                api-base-url: ${SONARR_API_URL}
                key: ${SONARR_KEY}
              template: &arr_recent |
                {{ $collapseAfter := .Options.IntOr "collapse-after" 5 }}
                {{ $showGrabbed := .Options.BoolOr "show-grabbed" false }}
                {{ $sortTime := .Options.StringOr "sort-time" "desc" }}
                {{ $coverProxy := .Options.StringOr "cover-proxy" "" }}
                {{ $size := .Options.StringOr "size" "medium" }}
                {{ $service := .Options.StringOr "service" "" }}
                {{ $type := .Options.StringOr "type" "" }}
                {{ $intervalH := .Options.IntOr "interval" 0 | mul 24 }}

                {{ $now := now | formatTime "2006-01-02T15:04:05" }}
                {{ $posInterval := (offsetNow (printf "+%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}
                {{ $negInterval := (offsetNow (printf "-%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}

                {{ $apiBaseUrl := .Options.StringOr "api-base-url" "" }}
                {{ $key := .Options.StringOr "key" "" }}
                {{ $url := .Options.StringOr "url" $apiBaseUrl }}

                {{ if or (and (ne $service "sonarr") (ne $service "radarr") (ne $service "lidarr"))
                         (and (ne $type "upcoming") (ne $type "recent") (ne $type "missing")) 
                         (eq $apiBaseUrl "") (eq $key "") (eq $url "") }}
                  <div class="widget-error-header">
                      <div class="color-negative size-h3">ERROR</div>
                      <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                      </svg>
                    </div>
                    <p class="break-all">
                      Some options are not set or malformed
                        <table style="border-spacing: 1rem;">
                          <tr><td>service</td><td>{{ $service }}</td><td>must be sonarr, radarr, or lidarr</td></tr>
                          <tr><td>type</td><td>{{ $type }}</td><td>must be upcoming, recent, or missing</td></tr>
                          <tr><td>api-base-url</td><td>{{ $apiBaseUrl }}</td><td>should include http(s):// and port if needed</td></tr>
                          <tr><td>key</td><td>{{ $key }}</td><td></td></tr>
                        </table> 
                    </p>
                {{ else }}
                  {{ $requestUrl := "" }}

                  {{ if eq $service "sonarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v3/history/since?includeSeries=true&includeEpisode=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50&includeSeries=true" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v3/calendar?includeSeries=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}

                  {{ else if eq $service "radarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v3/history/since?includeMovie=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v3/calendar?start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}

                  {{ else if eq $service "lidarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v1/history/since?includeArtist=true&includeAlbum=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v1/wanted/missing?page=1&pageSize=50&includeArtist=true" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v1/calendar?includeArtist=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}
                  {{ end }}

                  {{ $data := newRequest $requestUrl
                    | withHeader "Accept" "application/json"
                    | withHeader "X-Api-Key" $key
                    | getResponse }}

                  <ul class="list list-gap-14 collapsible-container single-line-titles" data-collapse-after="{{ $collapseAfter }}">
                    {{ $array := "" }}
                    {{ $sortByField := "" }}
                    {{ $itemDisplayed := false }}
                    {{ $itemDate := "" }}
                    {{ $isAvailable := false }}

                    {{ if eq $type "missing" }}
                      {{ $array = "records" }}
                      {{ if eq $service "sonarr" }}
                        {{ $sortByField = "airDateUtc" }}
                      {{ else }}
                        {{ $sortByField = "releaseDate" }}
                      {{ end }}
                    {{ else if eq $type "recent" }}
                      {{ $sortByField = "date" }}
                    {{ else }}
                      {{ if eq $service "sonarr" }}
                        {{ $sortByField = "airDateUtc" }}
                      {{ else }}
                        {{ $sortByField = "releaseDate" }}
                      {{ end }}
                    {{ end }}

                    {{ range $data.JSON.Array $array | sortByTime $sortByField "rfc3339" $sortTime }}

                      {{ if eq $service "sonarr" }}
                        {{ $itemDate = .String "airDateUtc" | parseTime "RFC3339" }}
                        {{ $itemDate = $itemDate.In now.Location | formatTime "2006-01-02T15:04:05" }}
                        {{ $isAvailable = true }}
                      {{ else if eq $service "radarr"}}
                        {{ $isAvailable = .Bool "isAvailable" }}
                        {{ $itemDate = .String "releaseDate" }}
                      {{ else if eq $service "lidarr"}}
                        {{ $itemDate = .String "releaseDate" }}
                        {{ $isAvailable = true }}
                      {{ end }}

                      {{ if or (eq $type "upcoming") (eq $type "recent") (and (or (and (gt $itemDate $negInterval) ((lt $itemDate $now ))) (eq $intervalH 0))  $isAvailable) }}
                        {{ $itemDisplayed = true }}
                        {{ $title := "" }}
                        {{ $subtitle := "" }}
                        {{ $coverUrl := "" }}
                        {{ $status := "" }}
                        {{ $coverBase := "" }}
                        {{ $height := "" }}
                        {{ $width := "" }}
                        {{ $popoverTitle := "" }}
                        {{ $popoverSubtitle := "" }}
                        {{ $popoverSummary := "" }}
                        {{ $summary := "" }}
                        {{ $link := "" }}
                        {{ $grabbed := false }}
                        {{ $date := now }}
                        {{ $datetype := "" }}
                        {{ $seString := "" }}
                        {{ $genres := "" }}
                        {{ $buttonJustify := "left" }}


                        {{ if eq $service "sonarr" }}
                          {{ $series := "" }}
                          {{ if eq $coverProxy "" }}
                            {{ $coverBase = printf "%s/api/v3/mediacover" $apiBaseUrl }}
                            {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "seriesId") $key }}
                          {{ else }}
                            {{ $coverBase = $coverProxy }}
                            {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "seriesId") }}
                          {{ end }}
                          {{ $title = .String "series.title" }}
                          {{ $link = printf "%s/series/%s#" $url (.String "series.titleSlug") }}
                          {{ $series = .Get "series" }}
                          {{ $genres = $series.Get "genres" }}

                          {{ if eq $type "recent" }}
                            {{ $date = .String "date" | parseLocalTime "RFC3339" }}
                            {{ $date = $date.In now.Location }}
                            {{ $subtitle = .String "episode.title" }}
                            {{ $summary = .String "episode.overview" }}
                            {{ $seString = printf "S%02dE%02d" (.Int "episode.seasonNumber") (.Int "episode.episodeNumber") }}
                            {{ $datetype = "Downloaded" }}

                            {{ if $showGrabbed }}
                              {{ $popoverTitle = .String "episode.title" }}
                              {{ $popoverSubtitle = $seString }}
                              {{ $popoverSummary = .String "episode.overview" }}
                              {{ if .Bool "episode.hasFile" }}
                                {{ $grabbed = true }}
                              {{ end }}
                            {{ else }}
                              {{ $popoverTitle = .String "series.title" }}
                              {{ $popoverSummary = .String "series.overview" }}
                            {{ end }}

                          {{ else if eq $type "missing" }}
                            {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                            {{ $date = $date.In now.Location }}
                            {{ $subtitle = .String "title" }}
                            {{ $summary = .String "overview" }}
                            {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                            {{ $datetype = "Aired" }}
                            {{ if $showGrabbed }}
                              {{ $popoverTitle = .String "title" }}
                              {{ $popoverSubtitle = $seString }}
                              {{ $popoverSummary = .String "overview" }}
                              {{ if .Bool "episode.hasFile" }}
                                {{ $grabbed = true }}
                              {{ end }}
                            {{ else }}
                              {{ $popoverTitle = .String "series.title" }}
                              {{ $popoverSummary = .String "series.overview" }}
                            {{ end }}
                          {{ else if eq $type "upcoming" }}
                            {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                            {{ $date = $date.In now.Location }}
                            {{ $subtitle = .String "title" }}
                            {{ $summary = .String "overview" }}
                            {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                            {{ $datetype = "Airs" }}
                            {{ if $showGrabbed }}
                              {{ $popoverTitle = .String "title" }}
                              {{ $popoverSubtitle = $seString }}
                              {{ $popoverSummary = .String "overview" }}
                              {{ if .Bool "hasFile" }}
                                {{ $grabbed = true }}
                              {{ end }}
                            {{ else }}
                              {{ $popoverTitle = .String "series.title" }}
                              {{ $popoverSummary = .String "series.overview" }}
                            {{ end }}
                          {{ end }}


                        {{ else if eq $service "radarr" }}
                          {{ $movie := "" }}
                          {{ $status = .String "status" }}
                          {{ if eq $coverProxy "" }}
                            {{ $coverBase = printf "%s/api/v3/mediacover" $apiBaseUrl }}
                          {{ else }}
                            {{ $coverBase = $coverProxy }}
                          {{ end }}
                          {{ if eq $status "announced"}}
                            {{ if ne (.String "inCinemas") "" }}
                              {{ $date = (.String "inCinemas" | parseTime "RFC3339") }}
                              {{ $datetype = "In Cinemas" }}
                            {{ else }}
                              {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                              {{ $datetype = "Releases" }}
                            {{ end }}
                          {{ else if eq $status "inCinemas"}}
                            {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                            {{ $datetype = "Releases" }}
                          {{ else if eq $status "released"}}
                            {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                            {{ $datetype = "Released" }}
                          {{ end }}

                          {{ if eq $type "recent" }}
                            {{ if eq $coverProxy "" }}
                              {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "movie.id") $key }}
                            {{ else }}
                              {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "movie.id") }}
                            {{ end }}
                            {{ $datetype = "Downloaded" }}
                            {{ $date = (.String "date" | parseTime "RFC3339") }}
                            {{ $title = .String "movie.title" }}
                            {{ $subtitle = "" }}
                            {{ $summary = .String "movie.overview" }}
                            {{ $popoverTitle = .String "movie.title" }}
                            {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                            {{ $popoverSummary = .String "movie.overview" }}
                            {{ $link = printf "%s/movie/%s#" $url (.String "movie.titleSlug") }}
                            {{ $movie = .Get "movie" }}
                            {{ $genres = $movie.Get "genres" }}
                            {{ if and $showGrabbed (gt (.Int "movie.movieFileId") 0) }}
                              {{ $grabbed = true }}
                            {{ end }}
                          {{ else }}
                            {{ if eq $coverProxy "" }}
                              {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "id") $key }}
                            {{ else }}
                              {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "id") }}
                            {{ end }}
                            {{ $title = .String "title" }}
                            {{ $subtitle = "" }}
                            {{ $summary = .String "overview" }}
                            {{ $link = printf "%s/movie/%s#" $url (.String "titleSlug") }}
                            {{ $popoverTitle = .String "title" }}
                            {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                            {{ $popoverSummary = .String "overview" }}
                            {{ $genres = .Get "genres" }}
                            {{ if eq $type "missing" }}
                              {{ if and $showGrabbed (.Bool "movie.hasFile") }}
                                {{ $grabbed = true }}
                              {{ end }}
                            {{ else }}
                              {{ if and $showGrabbed (.Bool "hasFile") }}
                                {{ $grabbed = true }}
                              {{ end }}
                            {{ end }}
                          {{ end }}


                        {{ else if eq $service "lidarr" }}
                          {{ $artist := "" }}
                          {{ $album := "" }}
                          {{ $albumId := "" }}
                          {{ if eq $coverProxy "" }}
                            {{ $coverBase = printf "%s/api/v1/mediacover" $apiBaseUrl }}
                          {{ else }}
                            {{ $coverBase = $coverProxy }}
                          {{ end }}

                          {{ if eq $type "recent" }}
                            {{ $album = .Get "album" }}
                            {{ $artist = $album.Get "artist" }}
                            {{ if eq $coverProxy "" }}
                              {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase (.String "albumId") $key }}
                            {{ else }}
                              {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase (.String "albumId") }}
                            {{ end }}
                            {{ $grabbed = true }}
                            {{ $title = $album.String "title" }}
                            {{ $date = (.String "date" | parseTime "RFC3339") }}
                            {{ $datetype = "Downloaded" }}
                            {{ $subtitle = $artist.String "artistName" }}
                            {{ $genres = $artist.Get "genres" }}
                            {{ $link = printf "%s/artist/%s#" $url ($artist.String "foreignArtistId") }}
                            {{ $summary = $album.String "overview" }}
                            {{ $popoverTitle = $album.String "title" }}
                            {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                            {{ $popoverSummary = $artist.String "overview" }}

                          {{ else }}
                            {{ $artist = .Get "artist" }}
                            {{ $album = .Get "album" }}
                            {{ if eq $type "missing" }}
                              {{ $datetype = "Released" }}
                            {{ else }}
                              {{ $datetype = "Releases" }}
                            {{ end }}
                            {{ range .Array "releases" }}
                              {{ $albumId = .String "albumId" }}
                              {{ break }}
                            {{ end }}
                            {{ if eq $coverProxy "" }}
                              {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase $albumId $key }}
                            {{ else }}
                              {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase $albumId }}
                            {{ end }}
                            {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                            {{ $title = .String "title" }}
                            {{ $subtitle = $artist.String "artistName" }}
                            {{ $summary = $album.String "overview" }}
                            {{ $genres = $artist.Get "genres" }}
                            {{ $link = printf "%s/artist/%s#" $url ($artist.String "foreignArtistId") }}
                            {{ $popoverTitle = .String "title" }}
                            {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                            {{ $popoverSummary = .String "artist.overview" }}
                          {{ end }}
                        {{ end }}

                        {{ if eq $size "small" }}
                          {{ $buttonJustify = "right" }}
                          {{ $height = "9rem" }}
                          {{ if eq $service "lidarr" }}
                            {{ $width = "9rem" }}
                          {{ else }}
                            {{ $width = "6rem" }}
                          {{ end }}
                        {{ else if eq $size "medium" }}
                          {{ $height = "12rem" }}
                          {{ if eq $service "lidarr" }}
                            {{ $width = "12rem" }}
                          {{ else }}
                            {{ $width = "8rem" }}
                          {{ end }}
                        {{ else if eq $size "large" }} 
                          {{ $height = "15rem" }}
                          {{ if eq $service "lidarr" }}
                            {{ $width = "15rem" }}
                          {{ else }}
                            {{ $width = "10rem" }}
                          {{ end }}
                        {{ else if eq $size "huge" }} 
                          {{ $height = "18rem" }}
                          {{ if eq $service "lidarr" }}
                            {{ $width = "18rem" }}
                          {{ else }}
                            {{ $width = "12rem" }}
                          {{ end }}
                        {{ end }}

                        <li style="position: relative;">
                          <div class="flex gap-10 items-start thumbnail-container thumbnail-parent">
                            <div>
                              <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="width: {{ $width  }}; height: {{ $height }}; align-content: center;">
                                <div data-popover-html>
                                  <div style="margin: 5px;">
                                    <strong class="size-h4 color-primary" title="{{ $popoverTitle }}">{{ $popoverTitle }}</strong>
                                    <div class="size-h4 text-truncate text-very-compact color-subdue" title="{{ $popoverSubtitle }}">{{ $popoverSubtitle }}</div>
                                    <p class="margin-top-20" style="overflow-y: auto; text-align: justify; max-height: 20rem;">
                                      {{ if ne $popoverSummary "" }}
                                        {{ $popoverSummary }}
                                      {{ else }}
                                        TBA
                                      {{ end }}
                                    </p>
                                   {{ if gt (len ($genres.Array "")) 0 }}
                                    <ul class="attachments margin-top-20">
                                      {{ range $genres.Array "" }}
                                        <li>{{ .String "" }}</li>
                                      {{ end }}
                                    </ul>
                                    {{ end }}
                                  </div>
                                </div>
                                <img class="thumbnail" src="{{ $coverUrl }}" alt="Cover for {{ .String "title" }}" loading="lazy" style="width: 100%; height: 100%; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); object-fit: cover; border-radius: 0.5rem;">
                              </div>
                          </div>
                            <div class="shrink min-width-0" style="height: 9rem; position: relative; padding-top: 5px; padding-right: 5px;">
                              <strong class="size-h4 block text-truncate color-primary" title="{{ $title }}">{{ $title }}</strong>
                              <div class="text-truncate text-very-compact" title="{{ $subtitle }}">{{ $subtitle }}</div>
                              <div class="text-very-compact text-truncate">
                                {{ if eq $service "sonarr" }}
                                  <div>{{ $seString }} - {{ $datetype }} {{ $date.Format "1/2 03:04PM" }}</div>
                                {{ else }}
                                  <span>{{ $datetype }} {{ $date.Format "1/2" }}</span>
                                {{ end }}
                              </div>

                              {{ if $showGrabbed }}
                                {{ if eq $buttonJustify "right" }}
                                  </div>
                                  <a href="{{ $link }}" class="bookmarks-link size-h4 color-primary" target="_blank" rel="noreferrer"
                                    style="position: absolute; bottom: 1rem; right: 1rem;
                                      {{ if $grabbed }} color: var(--color-positive); border: 1px solid var(--color-positive); {{ else }} color: var(--color-negative); border: 1px solid var(--color-negative); {{ end }}
                                      font-weight: bold; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-top: 5px; text-decoration: none;">
                                  {{ if $grabbed }}Grabbed{{ else }}Missing{{ end }}
                                  </a>
                                {{ else }}
                                  <a href="{{ $link }}" class="bookmarks-link size-h4 color-primary" target="_blank" rel="noreferrer"
                                    style="{{ if $grabbed }} color: var(--color-positive); border: 1px solid var(--color-positive); {{ else }} color: var(--color-negative); border: 1px solid var(--color-negative); {{ end }}
                                      font-weight: bold; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-top: 5px; text-decoration: none;">
                                  {{ if $grabbed }}Grabbed{{ else }}Missing{{ end }}
                                  </a>
                                  </div>
                                {{ end }}
                              {{ else }}
                                <div class="{{ if eq $size "small" }}text-truncate{{ if eq $service "radarr" }} margin-top-5{{ end }}{{ else }}text-truncate-2-lines margin-top-5{{ end }}">
                                  {{ $summary }}
                                </div>
                              {{ end }}
                          </div>
                        </li>
                      {{ end }}
                    {{ end }}
                    {{ if not $itemDisplayed }}
                      <li>No items found.</li>
                    {{ end }}
                  </ul>
                {{ end }}

            - type: custom-api
              title: Radarr - Recent
              cache: 30m
              options:
                service: radarr
                type: recent
                size: small
                collapse-after: 3
                show-grabbed: false
                interval: 30
                api-base-url: ${RADARR_API_URL}
                key: ${RADARR_KEY}
              template: *arr_recent
      
      - size: small
        widgets:
        - type: custom-api
          title: Trending Media
          title-url: ${OVERSEERR_URL}/discover/trending    # trending, movies, or tv
          url: ${OVERSEERR_URL}/api/v1/discover/trending   # trending, movies, or tv
          cache: 15m
          headers:
            accept: "application/json"
            x-api-key: ${OVERSEERR_API_KEY}
          parameters:
            language: "en" # this can be changed to other languages if desired
            page: "1"
          options:
            show-media-type: true # set to false to hide the "| TV" or "| Movie" suffix
            show-media-desc: true # set to false to hide the media's summary
          template: |
            {{ $showMediaType := .Options.BoolOr "show-media-type" true }}
            {{ $showMediaDesc := .Options.BoolOr "show-media-desc" true }}

            {{ if eq .Response.StatusCode 200 }}
              {{ $items := .JSON.Array "results" }}
              {{ if gt (len $items) 0 }}
                <ul class="list list-gap-10 collapsible-container" data-collapse-after="4">
                {{ range $items }}
                  <li class="flex items-start gap-10 thumbnail-container thumbnail-parent">
                    {{ $mediaType := .String "mediaType" }}
                    {{ $mediaTitle := "" }}
                    {{ $mediaTypeUpper := "" }}
                    {{ if eq $mediaType "movie" }} {{ $mediaTitle = .String "title" }} {{ $mediaTypeUpper = "Movie" }}{{ else }}{{ $mediaTitle = .String "name" }} {{ $mediaTypeUpper = "TV" }}{{ end }}
                    {{ $overseerrUrl := concat "${OVERSEERR_URL}" "/" $mediaType "/" ( .String "id" ) }}
                    {{ $tmdbUrl := concat "https://www.themoviedb.org" "/" $mediaType "/" ( .String "id" ) }}
                    <a href={{ $overseerrUrl }} target="_blank">
                    <img src={{ concat "https://image.tmdb.org/t/p/w300" (.String "posterPath") }} style="border-radius: 5px; min-width: 5rem; max-width: 5rem;" class="card">
                    </a>
                    <div class="flex-1" style="padding-right: 5px;">
                      <p class="color-positive size-h4 text-truncate-2-lines margin-top-5" title={{ $mediaTitle }}><a href={{ $overseerrUrl }} target="_blank">{{ $mediaTitle }}</p>
                      <p class="size-h4" title="TMDB Rating"><a href={{ $tmdbUrl }} target="_blank">TMDB: {{ mul (.Float "voteAverage") 10 | toInt }}% {{ if $showMediaType }}| {{ $mediaTypeUpper }}{{ end }}</a></p>
                      {{ if $showMediaDesc }}<p class="color-subdue size-h4 text-truncate-2-lines" title={{ .String "overview" }}>{{ .String "overview" }}</p>{{ end }}
                    </div>
                  </li>
                {{ end }}
                </ul>
              {{ else }}
                <details style="margin-top:0.5rem">
                  <summary> Raw JSON:</summary>
                  <pre stye="font-size:10px">
              {{ (printf "%+v" .JSON) }}
                  </pre>
                </details>
              {{ end }}
            {{ end }}
        - type: custom-api
          title: Epic Games
          cache: 1h
          url: https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en&country=US&allowCountries=US
          template: |
            <div>
              {{ if eq .Response.StatusCode 200 }}
                <div class="horizontal-cards-2">
                  {{ range .JSON.Array "data.Catalog.searchStore.elements" }}
                    {{ $price := .String "price.totalPrice.discountPrice" }}
                    {{ $hasPromo := gt (len (.Array "promotions.promotionalOffers")) 0 }}
                    {{ if and $hasPromo (eq $price "0") }}
                      {{ $gamePage := .String "productSlug" }}
                      {{ if gt (len (.Array "offerMappings")) 0 }}
                        {{ $gamePage = .String "offerMappings.0.pageSlug" }}
                      {{end }}
                      <a href="https://store.epicgames.com/en-US/p/{{ $gamePage }}" target="_blank" class="card">
                        {{ $title := .String "title" }}
                        {{ range .Array "keyImages" }}
                          {{ if eq (.String "type") "OfferImageWide" }}
                            <img src="{{ .String "url" }}" alt="{{ $title }}" style="width: 100%; max-width: 300px; height: 150px; object-fit: cover; border-radius: var(--border-radius);">
                          {{ end }}
                        {{ end }}
                        <div class="card-content">
                          <span class="size-base color-primary">{{ $title }}</span><br>
                          <span class="size-h5 color-subdue">
                            {{ if $hasPromo }}
                              {{ $promotions := .Array "promotions.promotionalOffers" }}
                              {{ if gt (len $promotions) 0 }}
                                {{ $firstPromo := index $promotions 0 }}
                                {{ $offers := $firstPromo.Array "promotionalOffers" }}
                                {{ if gt (len $offers) 0 }}
                                  {{ $firstOffer := index $offers 0 }}
                                  Free until {{ slice ($firstOffer.String "endDate") 0 10 }}
                                {{ else }}
                                  Free this week!
                                {{ end }}
                              {{ else }}
                                Free this week!
                              {{ end }}
                            {{ end }}
                          </span>
                        </div>
                      </a>
                    {{ end }}
                  {{ end }}
                </div>
              {{ else }}
                <p class="color-negative">Error fetching Epic Games data.</p>
              {{ end }}
            </div>

  - name: Media
    icon: di:football
    width: default
    center-vertically: true
    columns:
      - size: small
        widgets:
        - type: weather
          location: Brasov, Romania

      - size: full
        widgets:

      - size: small
        widgets:
          - type: custom-api
            title: Next Race
            cache: 2h
            url: https://f1api.dev/api/current/next
            template: |
              <div class="flex flex-column gap-10">
                {{ $session := index (.JSON.Array "race") 0 }}
                <p class="size-h5">
                  Round {{ .JSON.String "round" }}
                </p>

                <div class="margin-block-4">
                  <p class="color-highlight">{{ $session.String "raceName" }}</p>
                  <p class="color-primary">
                    <span>Race</span>
                    {{ $datetime := concat ($session.String "schedule.race.date") "T" ($session.String "schedule.race.time") }}
                    <span
                      class="color-highlight"
                      title="{{ $session.String "schedule.race.date" }}"
                      {{ parseRelativeTime "rfc3339" $datetime }}
                    ></span>
                  </p>
                  <p class="size-h5">{{ $session.String "schedule.race.date" }} at {{ $session.String "schedule.race.time" }}</p>
                </div>

                <ul class="size-h5 attachments">
                  <li>{{ $session.String "circuit.country" }}</li>
                  <li>{{ $session.String "circuit.city" }}</li>
                  <li>{{ $session.String "circuit.circuitName" }}</li>
                </ul>
              </div>

          - type: custom-api
            title: Last Race Results
            cache: 1d
            url: https://f1api.dev/api/current/last/race
            template: |
              <div class="flex flex-column gap-10">
                <p class="size-h5">{{ .JSON.String "races.raceName" }}</p>
                <ul class="list collapsible-container" data-collapse-after="5">
                  {{ range $i, $v := .JSON.Array "races.results" }}
                  <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                    <span class="grow min-width-0">{{ .String "position" }}. {{ .String "driver.shortName" }}</span>
                    <span class="shrink-0 text-right">{{ .String "time" }}</span>
                  </li>
                  {{ end }}
                </ul>
              </div>

          - type: custom-api
            title: Drivers Standings
            cache: 1d
            url: https://f1api.dev/api/current/drivers-championship
            template: |
              <ul class="list collapsible-container" data-collapse-after="5">
                {{ range $i, $v := .JSON.Array "drivers_championship" }}
                <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                  <div class="grow min-width-0">
                    <span>{{ .String "position" }}. {{ .String "driver.shortName" }}</span>
                    <span class="size-h6">({{ .String "team.teamName" }})</span>
                  </div>
                  <span class="shrink-0 text-right">{{ .String "points" }}</span>
                </li>
                {{ end }}
              </ul>

          - type: custom-api
            title: Constructors Standings
            cache: 1d
            url: https://f1api.dev/api/current/constructors-championship
            template: |
              <ul class="list collapsible-container" data-collapse-after="5">
                {{ range $i, $v := .JSON.Array "constructors_championship" }}
                <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                  <span class="grow min-width-0">{{ .String "position" }}. {{ .String "team.teamName" }}</span>
                  <span class="shrink-0 text-right">{{ .String "points" }}</span>
                </li>
                {{ end }}
              </ul>