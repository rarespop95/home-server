services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - /docker/glance:/app/config
    environment:
      - GLANCE_PASSWORD=${GLANCE_PASSWORD}
      - PROXMOXVE_URL=${PROXMOXVE_URL}
      - PROXMOXVE_KEY=${PROXMOXVE_KEY}
      - ADGUARD_URL=${ADGUARD_URL}
      - ADGUARD_USERNAME=${ADGUARD_USERNAME}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD}
      - GLUETUN_URL=${GLUETUN_URL}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - SPEEDTEST_URL=${SPEEDTEST_URL}
      - SPEEDTEST_TRACKER_API_TOKEN=${SPEEDTEST_TRACKER_API_TOKEN}
      - SPEEDTEST_URL_VPN=${SPEEDTEST_URL_VPN}
      - SPEEDTEST_TRACKER_API_TOKEN_VPN=${SPEEDTEST_TRACKER_API_TOKEN_VPN}
      - IMMICH_URL=${IMMICH_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - SONARR_API_URL=${SONARR_API_URL}
      - SONARR_KEY=${SONARR_KEY}
      - RADARR_API_URL=${RADARR_API_URL}
      - RADARR_KEY=${RADARR_KEY}
    ports:
      - 8101:8080

  # Regular internet speed tests (direct, non-VPN).
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=${SPEEDTEST_URL}
      - DB_CONNECTION=sqlite
    volumes:
      - /docker/speedtest-tracker:/config
    ports:
      - 8766:80

  # FileBrowser Quantum (gtstef/filebrowser fork). Config is YAML, not settings.json.
  # config.yaml + database.db live in /home/filebrowser/data (mapped to host dir below).
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    user: ${PUID}:${PGID}
    environment:
      - FILEBROWSER_CONFIG=data/config.yaml
    volumes:
      - /data:/srv/data
      - /docker:/srv/docker
      - /docker/filebrowser/data:/home/filebrowser/data
    ports:
      - 8095:80 #Change the port if needed
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GUNICORN_CMD_ARGS=--bind 0.0.0.0:3003
    volumes:
      - /docker/immich/cache:/cache

networks:
  servarr:
    external: true
    name: arr_services_servarrnetwork
