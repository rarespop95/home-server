services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - /data/immich/:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_HOSTNAME=database # This matches your database service name
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_PORT=5432 # Default PostgreSQL port
      # ML server runs on a separate GPU machine. Either set IMMICH_ML_IP in .env
      # and uncomment below, or configure the endpoint in the web UI
      # (Settings > Machine Learning) as described in this folder's README.
      # - ML_ENDPOINT=http://${IMMICH_ML_IP}:3003
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:42cba146593a5ea9a622002c1b7cba5da7be248650cbb64ecb9c6c33d29794b1
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    # Migrated off the deprecated pgvecto-rs image (EOL) to Immich's own
    # VectorChord-based Postgres image. Tuning/preload libs are now baked into
    # the image, so the old `command:` line is removed. Do NOT downgrade Immich
    # below 1.133.0 after this migration.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if /docker/immich/db lives on a spinning HDD rather than SSD:
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - /docker/immich/db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
