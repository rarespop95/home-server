services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /docker/vaultwarden:/data  # Adjust path as needed
    environment:
      # WEBSOCKET_ENABLED is deprecated (ignored since v1.29, removed path in v1.31).
      # WebSockets now run on the main HTTP port by default — no setting needed.
      SIGNUPS_ALLOWED: 'false'   # Set to 'true' if you want to allow self-signup
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}  # Generate a strong token

      # Email configuration
      SMTP_HOST: in-v3.mailjet.com
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_FROM: ${SMTP_FROM}  # must match Mailgun domain
      SMTP_FROM_NAME: Vaultwarden
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
